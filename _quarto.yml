project:
  type: website
  output-dir: _site

website:
  title: "David의 People Analytics 노트"
  description: "People Analytics, 데이터 엔지니어링, 그리고 배움의 기록"
  navbar:
    background: light
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/kwng-quant
        aria-label: GitHub
  page-footer:
    center: "© 2026 David · Built with Quarto"
    background: light

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: "목차"
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fontsize: 1.05rem
    linestretch: 1.7
    grid:
      body-width: 820px